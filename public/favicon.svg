<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ficha de póker">
  <rect width="100" height="100" rx="18" fill="#1b241a"/>
  <!-- cuerpo y muescas del canto -->
  <circle cx="50" cy="50" r="42" fill="#b48e43"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#1b241a" stroke-width="11"
          stroke-dasharray="18 20.7"/>
  <!-- disco central con su anillo punteado y el borde del inserto -->
  <circle cx="50" cy="50" r="28" fill="#f6f2e8"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#b48e43" stroke-width="1.6"
          stroke-dasharray="3 4"/>
  <circle cx="50" cy="50" r="21" fill="none" stroke="#b48e43" stroke-width="1.4"/>
</svg>
